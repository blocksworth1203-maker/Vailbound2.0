<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vailbound – Sign Up</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background: #0f0f14;
      color: #f0e6d2;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .box {
      background: #1b1b26;
      padding: 30px;
      border-radius: 10px;
      width: 320px;
      text-align: center;
      box-shadow: 0 0 15px rgba(0,0,0,0.6);
    }

    h1 {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 5px;
      border: none;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #7c5cff;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #6a4de0;
    }

    .secondary {
      background: #444;
    }

    .secondary:hover {
      background: #555;
    }

    .error {
      color: #ff6b6b;
      margin-top: 10px;
    }

    .success {
      color: #7CFF8A;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>Create Account</h1>

    <input id="username" type="text" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button onclick="signup()">Sign Up</button>
    <button class="secondary" onclick="goLogin()">Back to Login</button>

    <div class="error" id="error"></div>
    <div class="success" id="success"></div>
  </div>

  <script>
    async function signup() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const errorBox = document.getElementById("error");
      const successBox = document.getElementById("success");

      errorBox.innerText = "";
      successBox.innerText = "";

      if (!username || !password) {
        errorBox.innerText = "Please fill out all fields.";
        return;
      }

      const res = await fetch("/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();

      if (data.success) {
        successBox.innerText = "Account created! Redirecting...";
        setTimeout(() => {
          window.location.href = "login.html";
        }, 1500);
      } else {
        errorBox.innerText = data.error || "Signup failed.";
      }
    }

    function goLogin() {
      window.location.href = "login.html";
    }
  </script>

</body>
</html>
